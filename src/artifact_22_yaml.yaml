version: '3.8'

services:
  krak-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krak_escrow_eventbus
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=KrAk9v8R1XW2Uf1vV3a8KxLp7V4rRzQn2L9xJm1yWpE
      - RESEND_API_KEY=re_test_000000000000000000000000
      - RESEND_FROM_EMAIL=billing@krakescrew.io
      - ENTERPRISE_ALERT_EMAIL=ops@enterprise.com
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"