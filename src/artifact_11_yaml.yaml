version: '3.8'

services:
  krakstream-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krakstream-relayer
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_HTTP=https://api.devnet.solana.com
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=Krak111111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - NOTIFICATION_EMAIL=finance@krak-sponsor.com
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"