version: '3.8'

services:
  krakflow-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krakflow-settlement-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=KRAK111111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - CLIENT_EMAIL=${CLIENT_EMAIL}
      - CONTRACTOR_EMAIL=${CONTRACTOR_EMAIL}
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"