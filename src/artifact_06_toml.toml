[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
resolution = true
skip-lint = false

[programs.devnet]
krakow_sentinel = "Krak7Z7qWj4UfPZfTNxTfV5m6H4Z2M4K8S2xH9X1p9P"

[programs.localnet]
krakow_sentinel = "Krak7Z7qWj4UfPZfTNxTfV5m6H4Z2M4K8S2xH9X1p9P"

[registry]
