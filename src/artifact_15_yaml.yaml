version: '3.8'

services:
  solana-validator:
    image: solanalabs/solana:v1.18.18
    container_name: aegis-solana-validator
    command: >
      solana-test-validator
      --reset
      --quiet
      --rpc-port 8899
      --bind-address 0.0.0.0
    ports:
      - "8899:8899"
      - "8900:8900"
    healthcheck:
      test: ["CMD-SHELL", "solana cluster-version --url http://127.0.0.1:8899 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 15

  aegis-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-event-daemon
    restart: unless-stopped
    depends_on:
      solana-validator:
        condition: service_healthy
    environment:
      - SOLANA_RPC_URL=http://solana-validator:8899
      - SOLANA_WS_URL=ws://solana-validator:8900
      - PROGRAM_ID=KrAk9wX5yWc7bE4U2jQpZ8vLm1R9oG3dF6sT0aB1xY2
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - AUDIT_ALERT_EMAIL=${AUDIT_ALERT_EMAIL:-treasury@krakow-hack.io}